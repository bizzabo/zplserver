name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing is granted unless a job asks for it.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Windows runners default to PowerShell; using bash everywhere keeps the
    # steps identical across the matrix.
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # The forward-progress tests in test_framing.py hang rather than fail if the
    # guards in split_stream are ever removed, so a bound is not optional.
    timeout-minutes: 10
    strategy:
      # One platform failing must not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version on purpose: setup-uv publishes no major
        # alias past v7, so "@v9" cannot resolve. Bump this deliberately.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Create the environment
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Run the test suite
        run: uv run pytest -q

      - name: Check that the package builds
        run: uv build

  # A single job to require in branch protection. Requiring the matrix jobs
  # directly would mean editing the protection settings every time the matrix
  # changes, and a required context that no longer runs blocks every pull request
  # indefinitely while it waits for a check that will never report.
  ci:
    name: CI
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix job succeeded
        if: needs.test.result != 'success'
        run: |
          echo "The test matrix reported: ${{ needs.test.result }}"
          exit 1
