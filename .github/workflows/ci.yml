name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing is granted unless a job asks for it.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Windows runners default to PowerShell; using bash everywhere keeps the
    # steps identical across the matrix.
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # The forward-progress tests in test_framing.py hang rather than fail if the
    # guards in split_stream are ever removed, so a bound is not optional.
    timeout-minutes: 10
    strategy:
      # One platform failing must not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Create the environment
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Run the test suite
        run: uv run pytest -q

      - name: Check that the package builds
        run: uv build
